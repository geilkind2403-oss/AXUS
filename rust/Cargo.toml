[workspace]
resolver = "2"
members = ["tvcore", "tv-server", "tv-launcher"]

[workspace.package]
version = "2.0.3"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
