[workspace]
resolver = "2"
members = ["tvcore", "tv-server", "tv-launcher"]

[workspace.package]
version = "0.0.3+15"
license = "GPL-3.0-or-later"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind: a panic in a side thread (player, download, decoder) ends only
# that thread -- it is logged in crash.log and the TV keeps running
panic = "unwind"
strip = true
