[package]
name = "tv-launcher"
version.workspace = true
edition.workspace = true
description = "TV launcher for the Raspberry Pi 3 on LibreELEC: draws straight to the TV (KMS), no Kodi, no browser"

[dependencies]
tvcore = { path = "../tvcore" }
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
libc = "0.2"
qrcodegen = "1.8"
symphonia = { version = "0.5", default-features = false, features = ["aac", "mp3", "flac", "pcm", "vorbis"] }

[build-dependencies]
# already in Cargo.lock (ring uses it): compiles the C++ parts (weather,
# fast menu glass, settings view)
cc = "1.11"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14"
drm-ffi = "0.9"
