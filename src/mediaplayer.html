<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Mediathek</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; outline: none; }
  video:focus, video:focus-visible { outline: none; }
  /* The playback controls are the launcher's own on-screen display (player-osd.js). */
  video::-webkit-media-controls { display: none !important; }
  /* Subtitles (MKV): big, readable from the sofa. */
  video::cue { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 42px; font-weight: 600; line-height: 1.3;
    color: #fff; background: rgba(0, 0, 0, 0.55); text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); }
  /* A little higher than the very bottom, clear of the OSD's progress bar. */
  video::-webkit-media-text-track-container { transform: translateY(-9vh); }
</style>
</head>
<body>
<video id="v" autoplay></video>
<script src="player-osd.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const src = params.get('src');
  const relPath = params.get('rel') || '';
  const resume = Number(params.get('resume')) || 0;
  const video = document.getElementById('v');
  let play = null;
  try { play = JSON.parse(params.get('play') || 'null'); } catch { play = null; }

  // MKV & co arrive as a live remux (server/videotools.js): a stream that
  // starts at ?t= and can't be seeked inside. The player sees a proxy of the
  // <video> whose clock is offset + the stream's own time; seeking asks the
  // server for the keyframe to start at, then restarts the stream there.
  let media = video;
  let offset = 0;
  if (play && play.remux) {
    let pending = null;
    let seekTimer = null;
    let forceH264 = false;
    let loadSeq = 0;
    const streamUrl = (t) => {
      const u = new URL(src);
      u.searchParams.set('t', String(t));
      if (play.a) u.searchParams.set('a', String(play.a));
      if (forceH264) u.searchParams.set('v', 'h264');
      return u.href;
    };
    async function keyframe(t) {
      if (!(t > 0) || !play.seek) return Math.max(0, t);
      try {
        const u = new URL(play.seek);
        u.searchParams.set('t', String(t));
        const r = await fetch(u.href);
        const j = await r.json();
        return Number.isFinite(j.t) ? j.t : t;
      } catch { return t; }
    }
    function loadSubs() {
      // Off first: a removed <track> would otherwise leave its last line on screen.
      [...video.querySelectorAll('track')].forEach((tr) => { tr.track.mode = 'disabled'; tr.remove(); });
      if (!(play.s >= 0) || !play.sub) return;
      const u = new URL(play.sub.replace('{n}', String(play.s)));
      u.searchParams.set('t', String(offset));
      const tr = document.createElement('track');
      tr.kind = 'subtitles';
      tr.srclang = 'de';
      tr.default = true;
      tr.src = u.href;
      video.appendChild(tr);
      tr.addEventListener('load', () => { tr.track.mode = 'showing'; });
      tr.track.mode = 'showing';
    }
    async function startAt(t, autoplay) {
      const seq = ++loadSeq;
      const at = await keyframe(t);
      if (seq !== loadSeq) return; // a newer seek came in meanwhile
      offset = at;
      pending = null;
      video.src = streamUrl(at);
      loadSubs();
      if (autoplay) video.play().catch(() => {});
    }
    // Holding ◀/▶ fires many seeks: the clock follows at once, the stream
    // restarts once the keys rest for a moment.
    function seekTo(t) {
      const dur = play.duration || 0;
      pending = Math.max(0, dur ? Math.min(dur - 1, t) : t);
      video.dispatchEvent(new Event('timeupdate'));
      clearTimeout(seekTimer);
      const autoplay = !video.paused;
      seekTimer = setTimeout(() => startAt(pending, autoplay), 350);
    }
    const shiftRanges = (r) => ({ length: r.length, start: (i) => offset + r.start(i), end: (i) => offset + r.end(i) });
    media = new Proxy(video, {
      get(target, prop) {
        if (prop === 'currentTime') return pending != null ? pending : offset + target.currentTime;
        if (prop === 'duration') return play.duration || offset + target.duration;
        if (prop === 'buffered') return shiftRanges(target.buffered);
        const v = Reflect.get(target, prop);
        return typeof v === 'function' ? v.bind(target) : v;
      },
      set(target, prop, value) {
        if (prop === 'currentTime') seekTo(Number(value) || 0);
        else target[prop] = value;
        return true;
      }
    });
    // HEVC the graphics chip can't decode: once, the same spot again with the
    // picture converted to H.264 on the server.
    video.addEventListener('error', (e) => {
      if (forceH264 || !play.hevc) return;
      e.stopImmediatePropagation();
      forceH264 = true;
      startAt(offset + video.currentTime, true);
    });
    const start = resume > 0 && (!play.duration || resume < play.duration - 15) ? resume : 0;
    startAt(start, true);
  }

  TvPlayer.init({ video: media, title: TvPlayer.titleFromPath(relPath || src) });
  if (!src) TvPlayer.error('Kein Video ausgewählt', 'Wähle einen Film in der Mediathek.');
  else if (media === video) video.src = src;
  video.focus();

  video.addEventListener('loadedmetadata', () => {
    // Don't resume into the last few seconds -- that's basically "finished".
    // (A remuxed stream already starts at its resume point.)
    if (media === video && resume > 0 && resume < video.duration - 15) {
      video.currentTime = resume;
    }
  });

  // Report progress periodically and on pause/end, so "weiterschauen" stays
  // accurate without spamming IPC on every frame.
  let lastReported = 0;
  function reportProgress() {
    if (!window.mediaPlayer || !relPath) return;
    const now = Math.floor(media.currentTime);
    if (Math.abs(now - lastReported) < 5) return;
    lastReported = now;
    window.mediaPlayer.reportProgress(relPath, now);
  }
  video.addEventListener('timeupdate', reportProgress);
  video.addEventListener('pause', reportProgress);
  video.addEventListener('ended', () => {
    if (window.mediaPlayer && relPath) window.mediaPlayer.reportProgress(relPath, 0); // finished -> clear resume
  });
</script>
</body>
</html>
