<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #msg {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: sans-serif; font-size: 18px; text-align: center; padding: 40px;
  }
</style>
</head>
<body>
<video id="v" autoplay controls></video>
<div id="msg" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const src = params.get('src');
  const video = document.getElementById('v');
  const msg = document.getElementById('msg');

  function showError(text) {
    video.style.display = 'none';
    msg.style.display = 'flex';
    msg.textContent = text;
  }

  if (!src) {
    showError('Kein Sender ausgewählt.');
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari/WebKit can play HLS natively.
    video.src = src;
  } else if (window.Hls && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) showError('Stream konnte nicht geladen werden.\n' + data.details);
    });
  } else {
    showError('HLS wird in dieser Umgebung nicht unterstützt.');
  }
</script>
</body>
</html>
