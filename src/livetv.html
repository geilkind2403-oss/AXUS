<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Live TV</title>
<link rel="stylesheet" href="livetv.css" />
</head>
<body>
  <!-- The picture: full screen while watching; shrinks into the preview box
       (transform only, GPU) when the guide opens. -->
  <div id="stage">
    <video id="v" autoplay playsinline></video>
    <div id="spinner"></div>
    <div id="nosignal">
      <div class="ns-icon"><svg viewBox="0 0 24 24"><path d="M12 3.5l9.5 17h-19zM12 10v4.5M12 17.5h.01"/></svg></div>
      <div class="ns-title">Sender momentan nicht verfügbar</div>
      <div class="ns-text">▲ ▼ anderen Sender wählen · OK Senderliste</div>
    </div>
  </div>

  <!-- Zap banner (bottom) -->
  <div id="banner">
    <div class="bn-num" id="bn-num"></div>
    <div class="bn-logo" id="bn-logo"></div>
    <div class="bn-text">
      <div class="bn-name" id="bn-name"></div>
      <div class="bn-sub"><span class="live-badge">LIVE</span><span id="bn-country"></span><span id="bn-fav" class="bn-fav">★ Favorit</span></div>
    </div>
    <div class="bn-right">
      <div class="bn-clock" id="bn-clock"></div>
      <div class="bn-hint">OK Senderliste · ▲▼ Umschalten</div>
    </div>
  </div>

  <!-- Direct channel number entry -->
  <div id="numentry"><div class="ne-label">Sender</div><div class="ne-digits" id="ne-digits"></div><div class="ne-name" id="ne-name"></div></div>

  <!-- Guide -->
  <div id="guide">
    <aside id="g-groups">
      <div class="g-brand">
        <div class="g-brand-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12.5" rx="2.5"/><path d="M8 21h8M9.5 2.5L12 5l2.5-2.5"/></svg></div>
        <div><div class="g-title">Live TV</div><div class="g-clock" id="g-clock"></div></div>
      </div>
      <div id="g-group-list"></div>
    </aside>
    <section id="g-channels">
      <div class="g-head"><div class="g-head-title" id="g-head-title"></div><div class="g-head-count" id="g-head-count"></div></div>
      <div id="g-list"></div>
    </section>
    <section id="g-detail">
      <div id="g-preview-frame"></div>
      <div class="gd-card">
        <div class="gd-logo" id="gd-logo"></div>
        <div class="gd-name" id="gd-name"></div>
        <div class="gd-meta" id="gd-meta"></div>
        <div class="gd-state" id="gd-state"></div>
      </div>
      <div class="g-hints" id="g-hints"></div>
    </section>
  </div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="livetv.js"></script>
</body>
</html>
