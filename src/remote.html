<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fernbedienung</title>
<style>
  :root {
    --bg-1: #0a0a0c;
    --bg-2: #131318;
    --text: #f1f1f3;
    --muted: #8b8b94;
    --accent: #3b6dff;
    --ok: #7CFFB2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(120% 90% at 50% -10%, #1b1b20 0%, var(--bg-2) 45%, var(--bg-1) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  #app {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }

  #top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #status {
    padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.06); color: var(--muted); white-space: nowrap;
  }
  #status.ok { color: var(--ok); background: rgba(124,255,178,0.1); }

  #modes { display: flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,0.06); }
  #modes button {
    border: none; background: none; color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 700;
    padding: 8px 14px; border-radius: 9px;
  }
  #modes button.active { background: rgba(255,255,255,0.12); color: var(--text); }
  #modes button:disabled { opacity: 0.35; }

  .view { flex: 1; display: none; min-height: 0; }
  .view.active { display: flex; }
  #touch-view { gap: 10px; }

  /* Touchpad */
  #pad {
    position: relative; flex: 1; border-radius: 28px; overflow: hidden;
    background:
      radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1.5px) 0 0 / 22px 22px,
      rgba(255,255,255,0.035);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  #pad-hint {
    color: var(--muted); font-size: 14px; line-height: 1.7; text-align: center; pointer-events: none;
    transition: opacity .4s;
  }
  #pad-hint b { color: var(--text); font-weight: 700; }
  #pad.used #pad-hint { opacity: 0; }
  .ripple {
    position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: rgba(59,109,255,0.35); pointer-events: none;
    animation: ripple .35s ease-out forwards;
  }
  .ripple.tap { background: rgba(59,109,255,0.7); }
  @keyframes ripple { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }

  /* Scroll wheel: a strip on the right, rolled like a mouse wheel. The
     ridges move with the finger, so it feels like turning something. */
  #wheel {
    position: relative; flex: none; width: 62px; border-radius: 28px; overflow: hidden;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.13) 0 2px, transparent 2px 18px) 0 var(--roll, 0px) / 100% 18px,
      linear-gradient(90deg, rgba(0,0,0,0.35), rgba(255,255,255,0.06) 50%, rgba(0,0,0,0.35));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    transition: box-shadow .15s, background-color .15s;
  }
  #wheel::before, #wheel::after {
    content: ''; position: absolute; left: 0; right: 0; height: 28%; pointer-events: none; z-index: 1;
  }
  #wheel::before { top: 0; background: linear-gradient(180deg, var(--bg-2), transparent); }
  #wheel::after { bottom: 0; background: linear-gradient(0deg, var(--bg-1), transparent); }
  #wheel.active { background-color: rgba(59,109,255,0.18); box-shadow: inset 0 0 0 2px var(--accent), 0 0 24px rgba(59,109,255,0.35); }
  #wheel-label {
    position: absolute; left: 50%; top: 50%; z-index: 2; transform: translate(-50%, -50%) rotate(-90deg);
    font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--muted); white-space: nowrap; pointer-events: none;
  }

  /* Gyro */
  #gyro-view { flex-direction: column; gap: 12px; }
  #click-btn {
    flex: 1; width: 100%; border-radius: 28px; border: none;
    background: rgba(255,255,255,0.05);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    color: var(--text); font-size: 22px; font-weight: 800; font-family: inherit; letter-spacing: 0.04em;
    transition: background .06s, transform .06s;
  }
  #click-btn.down { background: var(--accent); transform: scale(0.985); box-shadow: 0 0 40px rgba(59,109,255,0.5); }
  #click-btn small { display: block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  #click-btn.down small { color: rgba(255,255,255,0.75); }
  #gyro-enable {
    position: absolute; inset: 0; border: none; border-radius: 28px;
    background: rgba(10,10,12,0.85); color: var(--text); font-family: inherit; font-size: 17px; font-weight: 700;
  }
  #gyro-enable small { display: block; margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--muted); padding: 0 30px; line-height: 1.5; }
  #gyro-wrap { position: relative; flex: 1; display: flex; }

  /* What the TV's music player plays (sent by the TV), with its transport. */
  #np { display: none; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; border-radius: 18px; background: rgba(255,255,255,0.06); }
  #np.on { display: flex; }
  #np-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  #np-text b { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np-text span { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np button {
    flex: none; width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 18px;
    background: rgba(255,255,255,0.08); color: var(--text); font-family: inherit;
  }
  #np button#np-play { width: 56px; height: 56px; background: #fff; color: #0b0b0e; }
  #np button:active { transform: scale(0.94); }
  #bottom { display: flex; gap: 12px; }
  #bottom button {
    flex: 1; padding: 18px 10px; border-radius: 18px; border: none;
    background: rgba(255,255,255,0.08); color: var(--text); font-family: inherit; font-size: 16px; font-weight: 700;
  }
  #bottom button:active { background: rgba(255,255,255,0.18); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="status">Verbinde…</div>
    <div id="modes">
      <button data-mode="touch">Touchpad</button>
      <button data-mode="gyro">Gyro</button>
    </div>
  </div>

  <div class="view" id="touch-view">
    <div id="pad">
      <div id="pad-hint"><b>Wischen</b> bewegt den Zeiger<br><b>Tippen</b> klickt<br><b>Rad rechts</b> scrollt</div>
    </div>
    <div id="wheel"><span id="wheel-label">SCROLLEN</span></div>
  </div>

  <div class="view" id="gyro-view">
    <div id="gyro-wrap">
      <button id="click-btn">OK<small>Handy flach halten &amp; schwenken</small></button>
      <button id="gyro-enable">Gyro aktivieren<small id="gyro-enable-sub">Einmal tippen, dann Bewegungssensoren erlauben</small></button>
    </div>
  </div>

  <div id="np">
    <div id="np-text"><b id="np-title"></b><span id="np-artist"></span></div>
    <button data-k="MediaTrackPrevious" aria-label="Zurück">&#9198;</button>
    <button id="np-play" data-k="MediaPlayPause" aria-label="Abspielen/Pause">&#9654;</button>
    <button data-k="MediaTrackNext" aria-label="Weiter">&#9197;</button>
  </div>

  <div id="bottom">
    <button id="back-btn">‹ Zurück</button>
    <button id="home-btn">⌂ Home</button>
    <button id="recenter-btn">⟲ Zentrieren</button>
  </div>
</div>

<script>
  // Every input is sent the instant it happens -- no batching, no rAF --
  // the phone is the only place latency could be added, so it adds none.
  var statusEl = document.getElementById('status');
  var ws = null;
  var secure = location.protocol === 'https:' && window.isSecureContext;

  function setStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.classList.toggle('ok', !!ok);
  }

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = function () { setStatus('Verbunden', true); };
    ws.onclose = function () { setStatus('Getrennt…'); setTimeout(connect, 800); };
    ws.onmessage = function (ev) {
      var m = null;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'h') {
        // The TV's pointer landed on something new: a short tick you can feel.
        if (navigator.vibrate) navigator.vibrate(8);
      } else if (m.t === 'np') {
        var box = document.getElementById('np');
        box.classList.toggle('on', !!m.title);
        document.getElementById('np-title').textContent = m.title || '';
        document.getElementById('np-artist').textContent = m.artist || '';
        document.getElementById('np-play').innerHTML = m.playing ? '&#10074;&#10074;' : '&#9654;';
      }
    };
  }
  connect();

  function send(s) {
    if (ws && ws.readyState === 1) ws.send(s);
  }

  // ---------- Modes ----------
  var modeButtons = document.querySelectorAll('#modes button');
  var mode = null;
  function setMode(m) {
    if (m === 'gyro' && !secure) return;
    mode = m;
    for (var i = 0; i < modeButtons.length; i++) modeButtons[i].classList.toggle('active', modeButtons[i].dataset.mode === m);
    document.getElementById('touch-view').classList.toggle('active', m === 'touch');
    document.getElementById('gyro-view').classList.toggle('active', m === 'gyro');
    try { localStorage.setItem('remote-mode', m); } catch (e) {}
  }
  for (var i = 0; i < modeButtons.length; i++) {
    modeButtons[i].addEventListener('click', function () { setMode(this.dataset.mode); });
  }
  if (!secure) {
    // Motion sensors are https-only on iOS; without the one-time
    // certificate setup only the touchpad is available.
    document.querySelector('#modes button[data-mode="gyro"]').disabled = true;
  }
  var saved = null;
  try { saved = localStorage.getItem('remote-mode'); } catch (e) {}
  setMode(saved === 'gyro' && secure ? 'gyro' : 'touch');

  // ---------- Touchpad ----------
  var pad = document.getElementById('pad');
  var trackId = null, lastX = 0, lastY = 0, lastT = 0, startT = 0, travel = 0;
  var twoFinger = false, lastTwoY = 0;
  var TAP_MS = 250, TAP_TRAVEL = 10;

  function touchById(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].identifier === id) return list[i];
    return null;
  }
  function avgY(list) { return (list[0].clientY + list[1].clientY) / 2; }
  function ripple(x, y, tap) {
    var r = pad.getBoundingClientRect();
    var el = document.createElement('div');
    el.className = 'ripple' + (tap ? ' tap' : '');
    el.style.left = (x - r.left) + 'px';
    el.style.top = (y - r.top) + 'px';
    pad.appendChild(el);
    setTimeout(function () { el.remove(); }, 400);
  }

  pad.addEventListener('touchstart', function (e) {
    e.preventDefault();
    pad.classList.add('used');
    if (e.targetTouches.length >= 2) {
      // Second finger down: switch to scrolling for the rest of this
      // gesture (until all fingers lift), so lifting one finger doesn't
      // make the pointer jump.
      twoFinger = true;
      trackId = null;
      lastTwoY = avgY(e.targetTouches);
      return;
    }
    var t = e.changedTouches[0];
    trackId = t.identifier;
    lastX = t.clientX; lastY = t.clientY;
    lastT = startT = e.timeStamp;
    travel = 0;
    ripple(t.clientX, t.clientY, false);
  }, { passive: false });

  pad.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (twoFinger) {
      if (e.targetTouches.length >= 2) {
        var y = avgY(e.targetTouches);
        var sdy = y - lastTwoY;
        lastTwoY = y;
        if (sdy) send('{"t":"s","y":' + (-sdy).toFixed(1) + '}'); // natural scrolling
      }
      return;
    }
    var t = touchById(e.changedTouches, trackId);
    if (!t) return;
    var dx = t.clientX - lastX, dy = t.clientY - lastY;
    var dt = Math.max(1, e.timeStamp - lastT);
    lastX = t.clientX; lastY = t.clientY; lastT = e.timeStamp;
    travel += Math.abs(dx) + Math.abs(dy);
    if (!dx && !dy) return;
    // Pointer acceleration like a laptop trackpad: slow = precise, a quick
    // flick crosses the whole TV.
    var speed = Math.sqrt(dx * dx + dy * dy) / dt; // px per ms
    var gain = 1 + Math.min(speed, 3) * 0.9;
    send('{"t":"m","x":' + (dx * gain).toFixed(2) + ',"y":' + (dy * gain).toFixed(2) + '}');
  }, { passive: false });

  function endTouch(e) {
    e.preventDefault();
    if (twoFinger) {
      if (e.targetTouches.length === 0) twoFinger = false;
      return;
    }
    var t = touchById(e.changedTouches, trackId);
    if (!t) return;
    trackId = null;
    if (e.type === 'touchend' && e.timeStamp - startT < TAP_MS && travel < TAP_TRAVEL) {
      send('{"t":"c"}');
      ripple(t.clientX, t.clientY, true);
    }
  }
  pad.addEventListener('touchend', endTouch, { passive: false });
  pad.addEventListener('touchcancel', endTouch, { passive: false });

  // ---------- Scroll wheel ----------
  // A finger belongs to where it went down, until it lifts: started on the
  // pad = pointer everywhere (even across the wheel), started on the wheel =
  // scrolling everywhere (even across the pad). Touch events stay with the
  // element a touch began on, and each side only looks at its own fingers
  // (targetTouches), so pad and wheel never steal from each other.
  var wheel = document.getElementById('wheel');
  var wheelId = null, wheelY = 0, roll = 0, tickAcc = 0;
  var WHEEL_GAIN = 1.6; // phone px -> scroll units

  wheel.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (wheelId !== null) return; // one finger rolls the wheel
    var t = e.changedTouches[0];
    wheelId = t.identifier;
    wheelY = t.clientY;
    wheel.classList.add('active');
  }, { passive: false });

  wheel.addEventListener('touchmove', function (e) {
    e.preventDefault();
    var t = touchById(e.changedTouches, wheelId);
    if (!t) return;
    var dy = t.clientY - wheelY;
    wheelY = t.clientY;
    if (!dy) return;
    // Like a mouse wheel: rolling down scrolls down.
    send('{"t":"s","y":' + (dy * WHEEL_GAIN).toFixed(1) + '}');
    roll += dy;
    wheel.style.setProperty('--roll', roll.toFixed(1) + 'px');
    tickAcc += Math.abs(dy);
    if (tickAcc >= 18) { tickAcc = 0; if (navigator.vibrate) navigator.vibrate(4); } // notch feel (Android)
  }, { passive: false });

  function endWheel(e) {
    e.preventDefault();
    if (!touchById(e.changedTouches, wheelId)) return;
    wheelId = null;
    wheel.classList.remove('active');
  }
  wheel.addEventListener('touchend', endWheel, { passive: false });
  wheel.addEventListener('touchcancel', endWheel, { passive: false });

  // ---------- Gyro ----------
  // Raw gyroscope (devicemotion.rotationRate, deg/s) rather than
  // deviceorientation angles: it's the sensor itself, not a fused estimate,
  // so it reacts sooner and has no gimbal-lock jumps near vertical.
  var gyroOn = false;
  var lastMotionT = 0;
  var DEADZONE = 1.2; // deg/s -- hand tremor / sensor noise, not intent

  function onMotion(e) {
    if (mode !== 'gyro') return;
    var r = e.rotationRate;
    if (!r || r.alpha === null) return;
    var t = e.timeStamp;
    var dt = lastMotionT ? (t - lastMotionT) / 1000 : 0;
    lastMotionT = t;
    if (dt <= 0 || dt > 0.1) return;
    // Phone flat, top edge toward the TV: yaw = about the screen normal
    // (alpha), pitch = about the left-right axis (beta). Left/up are
    // positive; screen x/y grow right/down, hence negated.
    var yaw = Math.abs(r.alpha) < DEADZONE ? 0 : r.alpha;
    var pitch = Math.abs(r.beta) < DEADZONE ? 0 : r.beta;
    if (!yaw && !pitch) return;
    send('{"t":"d","x":' + (-yaw * dt).toFixed(3) + ',"y":' + (-pitch * dt).toFixed(3) + '}');
  }

  function enableGyro() {
    gyroOn = true;
    window.addEventListener('devicemotion', onMotion);
    document.getElementById('gyro-enable').style.display = 'none';
  }

  document.getElementById('gyro-enable').addEventListener('click', function () {
    // iOS 13+: must be called from inside a tap handler.
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(function (state) {
        if (state === 'granted') enableGyro();
        else document.getElementById('gyro-enable-sub').textContent = 'Verweigert. Safari: aA-Menü → Website-Einstellungen → Bewegung erlauben.';
      }).catch(function (err) {
        document.getElementById('gyro-enable-sub').textContent = 'Fehler: ' + err.message;
      });
    } else {
      enableGyro();
    }
  });

  var clickBtn = document.getElementById('click-btn');
  // pointerdown, not click: fires on touch start, so the click lands where
  // the pointer is *now*, not after the finger lifts.
  clickBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    clickBtn.classList.add('down');
    send('{"t":"c"}');
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    clickBtn.addEventListener(ev, function () { clickBtn.classList.remove('down'); });
  });

  // ---------- Buttons ----------
  document.getElementById('back-btn').addEventListener('click', function () { send('{"t":"k","k":"Escape"}'); });
  // Home: straight back to the TV's home screen from anywhere (closes every
  // overlay and the running app), like the house button on a TV remote.
  // Held for 1.5 s instead: opens the Control Center (like holding OK on
  // a real remote). The Home tap is sent on release only if it was short.
  var homeBtn = document.getElementById('home-btn');
  var homeTimer = null;
  var homeLong = false;
  homeBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    homeLong = false;
    clearTimeout(homeTimer);
    homeTimer = setTimeout(function () {
      homeTimer = null;
      homeLong = true;
      if (navigator.vibrate) navigator.vibrate(30);
      send('{"t":"cc"}');
    }, 1500);
  });
  homeBtn.addEventListener('pointerup', function () {
    if (homeTimer) { clearTimeout(homeTimer); homeTimer = null; send('{"t":"k","k":"Home"}'); }
  });
  ['pointercancel', 'pointerleave'].forEach(function (ev) {
    homeBtn.addEventListener(ev, function () { clearTimeout(homeTimer); homeTimer = null; });
  });
  homeBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); }); // no long-press menu
  document.getElementById('recenter-btn').addEventListener('click', function () { send('{"t":"r"}'); });
  var npButtons = document.querySelectorAll('#np button');
  for (var n = 0; n < npButtons.length; n++) {
    npButtons[n].addEventListener('click', function () {
      if (navigator.vibrate) navigator.vibrate(12);
      send(JSON.stringify({ t: 'k', k: this.dataset.k }));
    });
  }
</script>
</body>
</html>
