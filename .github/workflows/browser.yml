name: YouTube TV browser (WPE WebKit for the Pi 3)

# Builds WPE WebKit + cog + Mesa + GStreamer for the Raspberry Pi 3 with
# Buildroot. A full build is long: the compiler cache is saved even when a
# run hits the time limit, so the next run continues where this one stopped.
on:
  workflow_dispatch:
  push:
    paths: ["browser/**", ".github/workflows/browser.yml"]

env:
  # the 2025.02 long-term branch (gets fixes, keeps option names)
  BR_VERSION: "2025.02.x"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Host packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential bc bison flex gperf python3 rsync unzip wget cpio file ninja-build ruby perl libssl-dev

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ env.BR_VERSION }}-${{ hashFiles('browser/**') }}-${{ github.run_id }}
          restore-keys: |
            br-ccache-${{ env.BR_VERSION }}-${{ hashFiles('browser/**') }}-
            br-ccache-${{ env.BR_VERSION }}-

      - name: Restore downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/br-dl
          key: br-dl-${{ env.BR_VERSION }}-${{ github.run_id }}
          restore-keys: br-dl-${{ env.BR_VERSION }}-

      - name: Get Buildroot
        run: |
          git clone --depth 1 --branch $BR_VERSION https://github.com/buildroot/buildroot ~/buildroot
          git -C ~/buildroot log -1 --format='Buildroot %h %cd'

      - name: Configure
        run: |
          cd ~/buildroot
          make BR2_EXTERNAL=$GITHUB_WORKSPACE/browser/br2-external BR2_DL_DIR=$HOME/br-dl tvbrowser_defconfig
          $GITHUB_WORKSPACE/browser/check-config.sh ~/buildroot

      - name: Download sources
        run: cd ~/buildroot && make BR2_DL_DIR=$HOME/br-dl source

      - name: Save downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/br-dl
          key: br-dl-${{ env.BR_VERSION }}-${{ github.run_id }}

      - name: Build
        id: build
        timeout-minutes: 320
        run: |
          cd ~/buildroot
          # full output to a file; on the page only Buildroot's progress
          # lines (">>> webkit 2.x Building") plus a heartbeat every 10 minutes
          ( while sleep 600; do echo "... still building ($(date -u +%H:%M), $(df -h / | awk 'NR==2{print $4}') free)"; done ) &
          set +e
          make BR2_DL_DIR=$HOME/br-dl BR2_JLEVEL=$(nproc) 2>&1 | tee ~/build.log | grep --line-buffered -E '^>>> |Error|error:'
          status=${PIPESTATUS[0]}
          echo "make exited with $status"
          exit $status

      - name: Build log (tail)
        if: always()
        run: tail -n 150 ~/build.log || true

      - name: Compiler cache stats
        if: always()
        run: ccache -d ~/.buildroot-ccache -s 2>/dev/null || ~/buildroot/output/host/bin/ccache -d ~/.buildroot-ccache -s || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: br-ccache-${{ env.BR_VERSION }}-${{ hashFiles('browser/**') }}-${{ github.run_id }}

      - name: Package
        run: |
          mkdir -p dist
          cp ~/buildroot/output/images/rootfs.tar.gz dist/tv-browser-rootfs.tar.gz
          ls -la dist
          du -sh ~/buildroot/output/target

      - uses: actions/upload-artifact@v4
        with:
          name: tv-browser-pi
          path: dist/
