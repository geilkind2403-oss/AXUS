name: Raspberry Pi Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pi-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - run: ./build-pi.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rust/dist/tv-launcher-update.tar.gz
            rust/dist/tv-launcher-pi.tar.gz
